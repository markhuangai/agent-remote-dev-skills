name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skill packages
        run: python scripts/validate_skills.py
      - name: Test package validation
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test PR helpers
        run: python -m unittest discover -s skills/pr-review-loop/scripts -p 'test_*.py'
      - name: Verify discovery and installation
        run: python scripts/smoke_install.py
